[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "logsentinel"
version = "0.1.0"
description = "LogLLaMA-inspired, tenant-isolated log anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.5,<2",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
data = ["datasets>=3.2,<5", "drain3>=0.9,<1"]
dashboard = ["plotly>=6,<7", "streamlit>=1.42,<2"]
ml = [
  "accelerate>=1.3,<2",
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
  "peft>=0.14,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<6",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
logsentinel = "logsentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/logsentinel"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

